<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Giriş | Çiçəkxalı</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <img src="../assets/images/image2.png" alt="Çiçəkxalı" class="logo-img">
            </div>
            <h2>Admin Girişi</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>İstifadəçi Adı</label>
                    <input type="text" id="username" placeholder="cicekxali.az" required>
                </div>
                <div class="form-group">
                    <label>Şifrə</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div id="errorMessage" style="color: #e31f26; font-size: 0.85rem; margin-bottom: 15px; display: none; font-weight: 600;">
                    İstifadəçi adı və ya şifrə yanlışdır!
                </div>
                <button type="submit" class="login-btn">Giriş Et</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const error = document.getElementById('errorMessage');
            error.textContent = 'Təhlükəsizlik üçün admin giriş məlumatları GitHub fayllarında saxlanılmır. Admin girişini server tərəfdə konfiqurasiya edin.';
            error.style.display = 'block';
        });
    </script>
</body>
</html>
